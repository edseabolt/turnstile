<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="turnstile compact pipeline strip, two rows read left to right: row one planner, plan gate (VERDICT: APPROVE), executor, test-runner, test gate (GATE: PASS), with the turnstile.jsonl receipt; an elbow connector wraps down to row two: reviewer, review gate (VERDICT: APPROVE), landing gate, push; blocked stubs mark the gates that can refuse">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="0.55" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <radialGradient id="cvignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="cglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDD6F4" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#CDD6F4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cacc-plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C2E7"/><stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <linearGradient id="cacc-test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E3A1"/><stop offset="1" stop-color="#94E2D5"/>
    </linearGradient>
    <linearGradient id="cacc-review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89B4FA"/><stop offset="1" stop-color="#74C7EC"/>
    </linearGradient>
    <linearGradient id="cacc-push" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E2AF"/><stop offset="1" stop-color="#FAB387"/>
    </linearGradient>
    <linearGradient id="cflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89B4FA"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ccardshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      @keyframes cdashmove { to { stroke-dashoffset: -22; } }
      .cflow { stroke-dasharray: 7 5; animation: cdashmove 1.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .cflow { animation: none; } }
    </style>
    <marker id="carrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89B4FA"/>
    </marker>
    <g id="cturnstile-arm">
      <circle cx="0" cy="0" r="3.5" fill="none" stroke-width="1.6"/>
      <line x1="0" y1="-4" x2="0" y2="-11" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="0" y2="11" stroke-width="2" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="-11" y2="0" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="11" y2="0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" fill="url(#cbg)"/>
  <rect width="1200" height="380" fill="url(#cvignette)"/>
  <g stroke="#CDD6F4" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 146H1200M0 254H1200M0 362H1200"/>
    <path d="M120 0V380M240 0V380M360 0V380M480 0V380M600 0V380M720 0V380M840 0V380M960 0V380M1080 0V380"/>
  </g>

  <!-- header -->
  <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#CDD6F4">turnstile</text>
  <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-style="italic" fill="#A6ADC8">gates the runtime enforces, not requests the model honors</text>

  <!-- band -->
  <rect x="16" y="84" width="1168" height="250" rx="12" fill="url(#cglass)" stroke="#89B4FA" stroke-opacity="0.22" stroke-width="1"/>

  <!-- row 1 flow line -->
  <path class="cflow" d="M40 146 H710" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55"/>

  <!-- planner entry label -->
  <text x="92" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#CDD6F4">planner</text>

  <!-- plan gate -->
  <g filter="url(#cglow)">
    <rect x="156" y="108" width="176" height="76" rx="10" fill="#1E1E2E" stroke="url(#cacc-plan)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(172 146)" stroke="#F5C2E7"/>
  <text x="258" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#F5C2E7">plan gate</text>
  <text x="258" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#CDD6F4">VERDICT: APPROVE</text>
  <text x="258" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">human approval</text>

  <!-- executor label -->
  <text x="396" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#CDD6F4">executor</text>

  <!-- test-runner label -->
  <text x="530" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#CDD6F4">test-runner</text>

  <!-- test gate -->
  <g filter="url(#cglow)">
    <rect x="620" y="108" width="180" height="76" rx="10" fill="#1E1E2E" stroke="url(#cacc-test)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(636 146)" stroke="#A6E3A1"/>
  <text x="724" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#A6E3A1">test gate</text>
  <text x="724" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#CDD6F4">GATE: PASS</text>
  <text x="724" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">exit-0 verified</text>

  <!-- journal receipt -->
  <g filter="url(#ccardshadow)">
    <rect x="836" y="108" width="240" height="76" rx="10" fill="#1E1E2E" stroke="#CBA6F7" stroke-opacity="0.7" stroke-width="1.4"/>
  </g>
  <text x="956" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#A6ADC8">every decision →</text>
  <text x="956" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#CBA6F7">turnstile.jsonl</text>
  <text x="956" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#A6ADC8">the receipt you can replay</text>

  <!-- elbow connector: end of row 1 wraps to the start of row 2 -->
  <path class="cflow" d="M710 184 V202 H92 V236" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#carrow)"/>

  <!-- row 2 flow line -->
  <path class="cflow" d="M40 254 H664" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#carrow)"/>

  <!-- reviewer label -->
  <text x="92" y="259" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#CDD6F4">reviewer</text>

  <!-- review gate -->
  <g filter="url(#cglow)">
    <rect x="160" y="216" width="184" height="76" rx="10" fill="#1E1E2E" stroke="url(#cacc-review)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(176 254)" stroke="#89B4FA"/>
  <text x="266" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#89B4FA">review gate</text>
  <text x="266" y="263" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#CDD6F4">VERDICT: APPROVE</text>
  <text x="266" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">ensemble ×2</text>

  <!-- landing gate -->
  <g filter="url(#cglow)">
    <rect x="420" y="216" width="188" height="76" rx="10" fill="#1E1E2E" stroke="url(#cacc-push)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(436 254)" stroke="#F9E2AF"/>
  <text x="528" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#F9E2AF">landing gate</text>
  <text x="528" y="263" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#CDD6F4">reviewer approved</text>
  <text x="528" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">git push gated</text>

  <!-- push endpoint -->
  <g filter="url(#ccardshadow)">
    <rect x="668" y="223" width="80" height="62" rx="26" fill="#1E1E2E" stroke="#FAB387" stroke-width="1.6"/>
  </g>
  <text x="708" y="259" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#FAB387">push</text>

  <!-- red blocked stubs, row 1 (above the cards) -->
  <g stroke="#F38BA8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M258 108 L 258 98" opacity="0.9"/>
    <path d="M724 108 L 724 98" opacity="0.9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#F38BA8" opacity="0.75">
    <text x="258" y="94" text-anchor="middle">block</text>
    <text x="724" y="94" text-anchor="middle">block</text>
  </g>

  <!-- red blocked stubs, row 2 (below the cards) -->
  <g stroke="#F38BA8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M266 292 L 266 304" opacity="0.9"/>
    <path d="M528 292 L 528 304" opacity="0.9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#F38BA8" opacity="0.75">
    <text x="266" y="318" text-anchor="middle">block</text>
    <text x="528" y="318" text-anchor="middle">block</text>
  </g>

  <!-- blocked accent line -->
  <text x="600" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#F38BA8">a red gate answers BLOCKED by turnstile: &lt;reason&gt; and escalates to a human ask</text>
</svg>