<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" aria-label="turnstile compact pipeline strip, two rows: planner, plan gate (VERDICT: APPROVE), executor, test gate (GATE: PASS), test-runner, then review gate (VERDICT: APPROVE), reviewer, landing gate, push; blocked stubs mark the gates that can refuse; every decision lands in turnstile.jsonl">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="0.55" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <radialGradient id="cvignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="cglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDD6F4" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#CDD6F4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cacc-plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C2E7"/><stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <linearGradient id="cacc-test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E3A1"/><stop offset="1" stop-color="#94E2D5"/>
    </linearGradient>
    <linearGradient id="cacc-review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89B4FA"/><stop offset="1" stop-color="#74C7EC"/>
    </linearGradient>
    <linearGradient id="cacc-push" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E2AF"/><stop offset="1" stop-color="#FAB387"/>
    </linearGradient>
    <linearGradient id="cflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89B4FA"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ccardshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      @keyframes cdashmove { to { stroke-dashoffset: -22; } }
      .cflow { stroke-dasharray: 7 5; animation: cdashmove 1.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .cflow { animation: none; } }
    </style>
    <marker id="carrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89B4FA"/>
    </marker>
    <g id="cturnstile-arm">
      <circle cx="0" cy="0" r="3.5" fill="none" stroke-width="1.6"/>
      <line x1="0" y1="-4" x2="0" y2="-11" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="0" y2="11" stroke-width="2" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="-11" y2="0" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="11" y2="0" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="880" height="344" fill="url(#cbg)"/>
  <rect width="880" height="344" fill="url(#cvignette)"/>
  <g stroke="#CDD6F4" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 86H880M0 172H880M0 258H880"/>
    <path d="M110 0V344M220 0V344M330 0V344M440 0V344M550 0V344M660 0V344M770 0V344"/>
  </g>

  <!-- header -->
  <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#CDD6F4">turnstile</text>
  <text x="24" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-style="italic" fill="#A6ADC8">gates the runtime enforces, not requests the model honors</text>
  <text x="856" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#CBA6F7">every decision → turnstile.jsonl</text>

  <!-- band -->
  <rect x="12" y="72" width="856" height="240" rx="12" fill="url(#cglass)" stroke="#89B4FA" stroke-opacity="0.22" stroke-width="1"/>

  <!-- row 1 flow line -->
  <path class="cflow" d="M36 131 H636" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#carrow)"/>

  <!-- planner entry label -->
  <text x="56" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#CDD6F4">planner</text>

  <!-- plan gate -->
  <g filter="url(#cglow)">
    <rect x="100" y="96" width="144" height="70" rx="10" fill="#1E1E2E" stroke="url(#cacc-plan)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(116 131)" stroke="#F5C2E7"/>
  <text x="182" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#F5C2E7">plan gate</text>
  <text x="182" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#CDD6F4">VERDICT: APPROVE</text>
  <text x="182" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#A6ADC8">human approval</text>

  <!-- executor label -->
  <text x="294" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#CDD6F4">executor</text>

  <!-- test gate -->
  <g filter="url(#cglow)">
    <rect x="344" y="96" width="144" height="70" rx="10" fill="#1E1E2E" stroke="url(#cacc-test)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(360 131)" stroke="#A6E3A1"/>
  <text x="428" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#A6E3A1">test gate</text>
  <text x="428" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#CDD6F4">GATE: PASS</text>
  <text x="428" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#A6ADC8">exit-0 verified</text>

  <!-- test-runner label -->
  <text x="564" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#CDD6F4">test-runner</text>

  <!-- connector: row 1 down to row 2 -->
  <path class="cflow" d="M564 166 V192" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#carrow)"/>

  <!-- row 2 flow line (right to left) -->
  <path class="cflow" d="M438 231 H144" stroke="url(#cflow)" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#carrow)"/>

  <!-- review gate -->
  <g filter="url(#cglow)">
    <rect x="438" y="196" width="144" height="70" rx="10" fill="#1E1E2E" stroke="url(#cacc-review)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(454 231)" stroke="#89B4FA"/>
  <text x="524" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#89B4FA">review gate</text>
  <text x="524" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#CDD6F4">VERDICT: APPROVE</text>
  <text x="524" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#A6ADC8">ensemble ×2</text>

  <!-- reviewer label -->
  <text x="391" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#CDD6F4">reviewer</text>

  <!-- landing gate -->
  <g filter="url(#cglow)">
    <rect x="196" y="196" width="148" height="70" rx="10" fill="#1E1E2E" stroke="url(#cacc-push)" stroke-width="2"/>
  </g>
  <use href="#cturnstile-arm" transform="translate(212 231)" stroke="#F9E2AF"/>
  <text x="284" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#F9E2AF">landing gate</text>
  <text x="284" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#CDD6F4">reviewer approved</text>
  <text x="284" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#A6ADC8">git push gated</text>

  <!-- push endpoint -->
  <g filter="url(#ccardshadow)">
    <rect x="60" y="203" width="80" height="56" rx="24" fill="#1E1E2E" stroke="#FAB387" stroke-width="1.6"/>
  </g>
  <text x="100" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#FAB387">push</text>

  <!-- red blocked stubs, row 1 (above the cards) -->
  <g stroke="#F38BA8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M182 96 L 182 86" opacity="0.9"/>
    <path d="M428 96 L 428 86" opacity="0.9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#F38BA8" opacity="0.75">
    <text x="182" y="83" text-anchor="middle">block</text>
    <text x="428" y="83" text-anchor="middle">block</text>
  </g>

  <!-- red blocked stubs, row 2 (below the cards) -->
  <g stroke="#F38BA8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M524 266 L 524 278" opacity="0.9"/>
    <path d="M284 266 L 284 278" opacity="0.9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#F38BA8" opacity="0.75">
    <text x="524" y="290" text-anchor="middle">block</text>
    <text x="284" y="290" text-anchor="middle">block</text>
  </g>

  <!-- blocked accent line -->
  <text x="440" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#F38BA8">a red gate answers BLOCKED by turnstile: &lt;reason&gt; and escalates to a human ask</text>
</svg>