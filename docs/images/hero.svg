<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="560" viewBox="0 0 2400 560" role="img" aria-label="turnstile: the enforced pipeline — planner, plan-reviewer, executor, test-runner, reviewer with gates blocking every dispatch">
  <defs>
    <!-- Background: deep vertical gradient with a subtle vignette -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="0.55" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Glass panel gradient for node cards -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDD6F4" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#CDD6F4" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Per-gate accent gradients -->
    <linearGradient id="acc-plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C2E7"/><stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <linearGradient id="acc-test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E3A1"/><stop offset="1" stop-color="#94E2D5"/>
    </linearGradient>
    <linearGradient id="acc-review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89B4FA"/><stop offset="1" stop-color="#74C7EC"/>
    </linearGradient>
    <linearGradient id="acc-push" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E2AF"/><stop offset="1" stop-color="#FAB387"/>
    </linearGradient>
    <linearGradient id="acc-journal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBA6F7"/><stop offset="1" stop-color="#89B4FA"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89B4FA"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <!-- Glow filters for gates and the blocked accent -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- Dashed flow animation -->
    <style>
      @keyframes dashmove { to { stroke-dashoffset: -22; } }
      .flow { stroke-dasharray: 7 5; animation: dashmove 1.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89B4FA"/>
    </marker>
    <!-- Turnstile-arm icon (drawn once, reused) -->
    <g id="turnstile-arm">
      <circle cx="0" cy="0" r="5" fill="none" stroke-width="2"/>
      <line x1="0" y1="-5.5" x2="0" y2="-17" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="5.5" x2="0" y2="17" stroke-width="3" stroke-linecap="round"/>
      <line x1="-5.5" y1="0" x2="-17" y2="0" stroke-width="3" stroke-linecap="round"/>
      <line x1="5.5" y1="0" x2="17" y2="0" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ======== background ======== -->
  <rect width="2400" height="560" fill="url(#bg)"/>
  <rect width="2400" height="560" fill="url(#vignette)"/>
  <!-- faint grid texture -->
  <g stroke="#CDD6F4" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 80H2400M0 160H2400M0 240H2400M0 320H2400M0 400H2400M0 480H2400"/>
    <path d="M120 0V640M240 0V640M360 0V640M480 0V640M600 0V640M720 0V640M840 0V640M960 0V640M1080 0V640M1200 0V640M1320 0V640M1440 0V640M1560 0V640M1680 0V640M1800 0V640M1920 0V640M2040 0V640M2160 0V640M2280 0V640"/>
  </g>

  <!-- ======== header ======== -->
  <text x="120" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="700" fill="#CDD6F4">turnstile</text>
  <text x="120" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-style="italic" fill="#A6ADC8">gates the runtime enforces, not requests the model honors</text>

  <!-- ======== pipeline band ======== -->
  <!-- Band backing panel -->
  <rect x="90" y="200" width="2220" height="250" rx="22" fill="url(#glass)" stroke="#89B4FA" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Main flow line (behind nodes) -->
  <path class="flow" d="M150 325 H2260" stroke="url(#flow)" stroke-width="2.5" fill="none" opacity="0.55" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 1: planner ============ -->
  <g filter="url(#cardshadow)">
    <rect x="130" y="278" width="190" height="94" rx="47" fill="url(#glass)" stroke="#A6ADC8" stroke-width="1.6"/>
  </g>
  <text x="225" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#CDD6F4">planner</text>
  <text x="225" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A6ADC8">plan + chunks</text>

  <!-- ============ GATE 1: plan ============ -->
  <g filter="url(#glow)">
    <rect x="380" y="266" width="200" height="118" rx="16" fill="#1E1E2E" stroke="url(#acc-plan)" stroke-width="3"/>
  </g>
  <use href="#turnstile-arm" transform="translate(406 325)" stroke="#F5C2E7"/>
  <text x="497" y="313" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#F5C2E7">plan gate</text>
  <text x="497" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#CDD6F4">VERDICT: APPROVE</text>
  <text x="497" y="363" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">or human approval</text>

  <!-- ============ STAGE 2: executor ============ -->
  <g filter="url(#cardshadow)">
    <rect x="640" y="278" width="190" height="94" rx="47" fill="url(#glass)" stroke="#A6ADC8" stroke-width="1.6"/>
  </g>
  <text x="735" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#CDD6F4">executor</text>
  <text x="735" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A6ADC8">cites chunk-N/AC-n</text>

  <!-- ============ GATE 2: tests ============ -->
  <g filter="url(#glow)">
    <rect x="890" y="266" width="200" height="118" rx="16" fill="#1E1E2E" stroke="url(#acc-test)" stroke-width="3"/>
  </g>
  <use href="#turnstile-arm" transform="translate(916 325)" stroke="#A6E3A1"/>
  <text x="1007" y="313" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#A6E3A1">test gate</text>
  <text x="1007" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#CDD6F4">GATE: PASS</text>
  <text x="1007" y="363" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">verified by exit-0</text>

  <!-- ============ STAGE 3: test-runner ============ -->
  <g filter="url(#cardshadow)">
    <rect x="1150" y="278" width="210" height="94" rx="47" fill="url(#glass)" stroke="#A6ADC8" stroke-width="1.6"/>
  </g>
  <text x="1255" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#CDD6F4">test-runner</text>
  <text x="1255" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A6ADC8">runs the suite</text>

  <!-- ============ GATE 3: review ============ -->
  <g filter="url(#glow)">
    <rect x="1420" y="266" width="200" height="118" rx="16" fill="#1E1E2E" stroke="url(#acc-review)" stroke-width="3"/>
  </g>
  <use href="#turnstile-arm" transform="translate(1446 325)" stroke="#89B4FA"/>
  <text x="1537" y="313" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#89B4FA">review gate</text>
  <text x="1537" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#CDD6F4">VERDICT: APPROVE ×2</text>
  <text x="1537" y="363" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">ensemble enforced</text>

  <!-- ============ STAGE 4: reviewer ============ -->
  <g filter="url(#cardshadow)">
    <rect x="1680" y="278" width="190" height="94" rx="47" fill="url(#glass)" stroke="#A6ADC8" stroke-width="1.6"/>
  </g>
  <text x="1775" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#CDD6F4">reviewer</text>
  <text x="1775" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A6ADC8">findings + verdict</text>

  <!-- ============ GATE 4: landing ============ -->
  <g filter="url(#glow)">
    <rect x="1930" y="266" width="200" height="118" rx="16" fill="#1E1E2E" stroke="url(#acc-push)" stroke-width="3"/>
  </g>
  <use href="#turnstile-arm" transform="translate(1956 325)" stroke="#F9E2AF"/>
  <text x="2047" y="313" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#F9E2AF">landing gate</text>
  <text x="2047" y="341" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#CDD6F4">reviewer approved</text>
  <text x="2047" y="363" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#A6ADC8">git push gated</text>


  <!-- red blocked stubs: every gate can stop the flow -->
  <g stroke="#F38BA8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M480 384 L 480 416" opacity="0.9"/>
    <path d="M990 384 L 990 416" opacity="0.9"/>
    <path d="M1520 384 L 1520 416" opacity="0.9"/>
    <path d="M2030 384 L 2030 416" opacity="0.9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#F38BA8" opacity="0.75">
    <text x="480" y="436" text-anchor="middle">block</text>
    <text x="990" y="436" text-anchor="middle">block</text>
    <text x="1520" y="436" text-anchor="middle">block</text>
    <text x="2030" y="436" text-anchor="middle">block</text>
  </g>

  <!-- push endpoint -->
  <g filter="url(#cardshadow)">
    <rect x="2185" y="286" width="105" height="78" rx="39" fill="#1E1E2E" stroke="#FAB387" stroke-width="2"/>
  </g>
  <text x="2237" y="331" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#FAB387">push</text>

  <!-- ======== blocked accent line ======== -->
  <g>
    <path d="M480 384 L 480 430" stroke="#F38BA8" stroke-width="0" />
    <text x="1200" y="530" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#F38BA8" filter="url(#softglow)">a red gate answers BLOCKED by turnstile: &lt;reason&gt; and escalates to a human ask</text>
  </g>

  <!-- journal chip, bottom right of band -->
  <g filter="url(#cardshadow)">
    <rect x="100" y="212" width="340" height="40" rx="20" fill="#11111B" stroke="url(#acc-journal)" stroke-opacity="0.7" stroke-width="1.4"/>
  </g>
  <text x="270" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#CBA6F7">every decision → turnstile.jsonl</text>
</svg>