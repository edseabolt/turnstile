<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1120" viewBox="0 0 1760 1120" role="img" aria-label="terminal transcript of a real turnstile run: the orchestrator dispatches planner, plan-reviewer, executor, test-runner, and reviewer in sequence; an early executor dispatch and an unverified reviewer dispatch are blocked in red; GATE: PASS and VERDICT: APPROVE markers flip each gate green; every decision lands in turnstile.jsonl">
  <defs>
    <!-- Background: deep vertical gradient with a subtle vignette (matches hero.svg) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="0.55" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="cardshadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ======== background ======== -->
  <rect width="1760" height="1120" fill="url(#bg)"/>
  <rect width="1760" height="1120" fill="url(#vignette)"/>

  <!-- ======== terminal window ======== -->
  <g filter="url(#cardshadow)">
    <rect x="44" y="28" width="1672" height="1056" rx="20" fill="#11111B" stroke="#CDD6F4" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- title bar -->
  <circle cx="88" cy="62" r="8" fill="#F38BA8"/>
  <circle cx="120" cy="62" r="8" fill="#F9E2AF"/>
  <circle cx="152" cy="62" r="8" fill="#A6E3A1"/>
  <text x="880" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A6ADC8" opacity="0.7">opencode — one task, end to end</text>
  <line x1="45" y1="92" x2="1715" y2="92" stroke="#CDD6F4" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ======== stage gutter: chips + connector rail ======== -->
  <line x1="120" y1="168" x2="120" y2="842" stroke="#45475A" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- stage 1 · plan -->
  <rect x="62" y="128" width="116" height="26" rx="13" fill="#313244" stroke="#89B4FA" stroke-opacity="0.55" stroke-width="1"/>
  <text x="120" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#89B4FA">1 · PLAN</text>

  <!-- stage 2 · plan review -->
  <rect x="62" y="242" width="116" height="26" rx="13" fill="#313244" stroke="#F9E2AF" stroke-opacity="0.55" stroke-width="1"/>
  <text x="120" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#F9E2AF">2 · PLAN REVIEW</text>

  <!-- stage 3 · execute -->
  <rect x="62" y="470" width="116" height="26" rx="13" fill="#313244" stroke="#FAB387" stroke-opacity="0.55" stroke-width="1"/>
  <text x="120" y="488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#FAB387">3 · EXECUTE</text>

  <!-- stage 4 · test -->
  <rect x="62" y="584" width="116" height="26" rx="13" fill="#313244" stroke="#A6E3A1" stroke-opacity="0.55" stroke-width="1"/>
  <text x="120" y="602" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#A6E3A1">4 · TEST</text>

  <!-- stage 5 · review -->
  <rect x="62" y="812" width="116" height="26" rx="13" fill="#313244" stroke="#CBA6F7" stroke-opacity="0.55" stroke-width="1"/>
  <text x="120" y="830" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#CBA6F7">5 · REVIEW</text>

  <!-- ======== transcript ======== -->
  <!-- 1 · plan -->
  <text x="196" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#89B4FA">you ▸</text>
  <text x="278" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CDD6F4">add retry with backoff to the http client</text>

  <text x="196" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch planner</text>

  <text x="196" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">planner ▸</text>
  <text x="314" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">.opencode/plans/retry-backoff.md — ## Decomposition chunk-1 chunk-2</text>

  <!-- 2 · plan review: executor jumps the gun -->
  <text x="196" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch executor</text>

  <text x="196" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#F38BA8">BLOCKED by turnstile: no plan approval for "retry-backoff.md".</text>
  <text x="196" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#F38BA8">Dispatch the plan-reviewer subagent first; proceed with executor only after its</text>
  <text x="196" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#F38BA8">first line is VERDICT: APPROVE crit=&lt;n&gt; high=&lt;n&gt; med=&lt;n&gt; low=&lt;n&gt; …</text>

  <text x="196" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch plan-reviewer</text>

  <text x="196" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6E3A1">plan-reviewer ▸ VERDICT: APPROVE crit=0 high=1 med=2 low=0</text>

  <!-- 3 · execute -->
  <text x="196" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch executor (chunk-1 → AC-1, AC-2)</text>

  <text x="196" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">executor ▸ feat(http): retry with backoff — 4 files changed, committed</text>

  <text x="196" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">executor ▸ done — tests pass, ready for review</text>

  <!-- 4 · test: unverified claim hits the evidence gate -->
  <text x="196" y="604" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="604" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch reviewer</text>

  <text x="196" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#F38BA8">BLOCKED by turnstile: reviewer dispatch without gate evidence: a GATE: PASS</text>
  <text x="196" y="680" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#F38BA8">was recorded without a journaled successful test-command execution …</text>

  <text x="196" y="718" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#CBA6F7">orchestrator ▸</text>
  <text x="382" y="718" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">dispatch test-runner</text>

  <text x="196" y="756" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6E3A1">test-runner ▸ npm run ci → exit 0</text>

  <text x="196" y="794" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#A6E3A1" filter="url(#softglow)">test-runner ▸ GATE: PASS tests=412 passed=412 failed=0</text>

  <!-- 5 · review: block, fix, re-test, approve -->
  <text x="196" y="832" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#F9E2AF">reviewer ▸ VERDICT: BLOCK crit=1 high=2 med=1 low=0 (round 1) → findings</text>

  <text x="196" y="870" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6ADC8">executor ▸ address findings — chunk-2 (AC-3)</text>

  <text x="196" y="908" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#A6E3A1">test-runner ▸ GATE: PASS tests=427 passed=427 failed=0</text>

  <text x="196" y="946" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#A6E3A1" filter="url(#softglow)">reviewer ▸ VERDICT: APPROVE crit=0 high=0 med=1 low=2 (round 2) ✓</text>

  <!-- ======== footer: the journal ======== -->
  <line x1="196" y1="986" x2="1668" y2="986" stroke="#CBA6F7" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="932" y="1030" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600" fill="#CBA6F7">every decision → turnstile.jsonl · replayed by opencode-turnstile status · push waits for the verdict</text>
</svg>