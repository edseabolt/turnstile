name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing (OIDC) needs npm >= 11.5.1 and node 24 per the
      # npm docs / setup-node reports.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run ci:host
      - name: Guard tag against package.json version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" package.json || {
            echo "tag v$v does not match package.json version"; exit 1; }
      # Stage-only: the tarball lands in npm's review queue; a maintainer
      # approves it (2FA) on npmjs.com before it goes live. Pair with the
      # trusted-publisher config NOT allowing direct npm publish.
      - run: npm stage publish --provenance --access public
