# turnstile evidence — two jobs, two trust levels, one file.
#
#   pull_request        Validate. Checks out the PR head and runs
#                       `opencode-turnstile evidence --validate` on
#                       .turnstile/evidence.json. This job runs untrusted
#                       code, so its permissions are `contents: read` only:
#                       no `pull-requests: write` is granted here at all, so a
#                       compromise has nothing to spend.
#   pull_request_target  Publish. Runs the base ref's copy of this file (a pull
#                       request cannot rewrite the posting logic in its own
#                       diff), in the base context with a writable token. It
#                       has no checkout step and no run step: it reads the
#                       committed artifact files through the Contents API,
#                       asserts two byte-level invariants on the .md, appends
#                       a fixed amber notice when the evidence predates the
#                       latest non-evidence commit — found by walking back
#                       from the head (bounded at 100 commits) to the first
#                       commit that touches anything outside `.turnstile/`,
#                       falling back to the head date when the walk is
#                       exhausted, blocked, or the file list is empty or
#                       truncated — and upserts
#                       one comment keyed on the `turnstile:evidence` marker.
#
# Contributor bytes may be read; they are never executed. GitHub asks a
# maintainer to approve the first run from a new fork contributor, so a first
# badge can sit pending. To skip the wait where you already have comment
# rights:
#   gh pr comment <n> --repo <owner>/<repo> --body-file .turnstile/evidence.md
#
# This repo runs the installed copy with one substitution: validation calls
# `node scripts/evidence.mjs` instead of the published CLI, so the emitter
# and the artifact in this tree are checked against each other rather than
# against whichever version happens to be on npm. Consumers running a
# release that includes the `evidence` subcommand keep the `npx` line.
#
# Copy this file into your repo's .github/workflows/. The emitter writes both
# .turnstile/evidence.json and the sibling .turnstile/evidence.md
# (`evidence --out .turnstile/evidence.json`); commit both. The posted body is
# the committed Markdown verbatim, plus at most one fixed staleness notice
# appended by the workflow itself — neither job reads a journal or runs the
# pipeline. The byte invariants (marker first line, 1 KiB cap) apply to the
# committed artifact; the appended notice is workflow-authored bytes.

name: turnstile evidence

on:
  # Job 1 — validate. Runs against the PR head (untrusted code) with a
  # read-only token, so it may run the contributor's artifact and CLI flags but
  # holds no write permission to abuse.
  pull_request:
    types: [opened, synchronize, reopened]
  # Job 2 — publish. Base context, writable token, no checkout and no run
  # step: it reads the committed artifact files and asserts byte invariants
  # on the .md.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents:
    read # workflow floor; `pull-requests: write` is granted per-job
    # on the publish job only, so the validate job holds nothing

jobs:
  validate:
    # on: pull_request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate the committed evidence artifact
        run: |
          if [ ! -f .turnstile/evidence.json ]; then
            echo "No .turnstile/evidence.json committed; nothing to validate."
            exit 0
          fi
          node scripts/evidence.mjs --validate .turnstile/evidence.json

  publish:
    # on: pull_request_target; permissions: contents:read +
    # pull-requests:write; runs only when the artifact validated
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert the sticky evidence comment
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = "<!-- turnstile:evidence -->";
            const MAX_BYTES = 1024;
            const RULE_FIRST_LINE = "the first line is not exactly the turnstile:evidence marker";
            const RULE_SIZE = "the body exceeds 1 KiB";

            // 1. Read the one artifact file from the PR head through the
            //    Contents API. An open PR's head SHA is served by the base
            //    repository, so fork PRs resolve. A missing file is a no-op,
            //    not an error: a repo without the artifact simply has no
            //    badge.
            let body;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".turnstile/evidence.md",
                ref: context.payload.pull_request.head.sha,
              });
              body = Buffer.from(res.data.content, res.data.encoding).toString("utf8");
            } catch (e) {
              if (e.status === 404) {
                core.info("No .turnstile/evidence.md at the PR head; nothing to post.");
                return;
              }
              throw e;
            }

            // 2. Assert the two byte-level invariants. On failure, post a
            //    fixed red notice that names the rule — never the offending
            //    bytes — so a smuggled body can only cost the badge.
            let violation = null;
            if (body.split("\n")[0] !== MARKER) violation = RULE_FIRST_LINE;
            else if (Buffer.byteLength(body, "utf8") > MAX_BYTES) violation = RULE_SIZE;
            if (violation !== null) {
              body = [
                MARKER,
                `> **turnstile ✗** — committed evidence artifact rejected: ${violation}.`,
                ">",
                "> _Not proof: a correlated claim from the local journal. Ask for the journal to audit._",
              ].join("\n");
            }

            // 2b. Staleness notice. The journal is per-machine, so CI can
            //     never refresh the artifact — it can only notice when it is
            //     old. Read the committed JSON (the emitter's sibling of the
            //     .md), take the newest journal timestamp it reports
            //     (plan.at / tests.at / emittedAt — the emit-time event the
            //     emitter journals on every artifact write), and compare it
            //     with the latest commit that could have changed code:
            //     walking back from the head (bounded at 100 commits) to the
            //     first commit that touches anything outside .turnstile/ —
            //     evidence-only commits are the normal emit-and-commit
            //     refresh path. When the evidence predates that commit,
            //     append a fixed amber notice — never any document bytes —
            //     so a stale badge warns instead of reading as current.
            //     Best-effort: any failure to read the JSON or a commit skips
            //     the notice, and the .md alone still posts. Conservative
            //     fallbacks to the head date: walk exhaustion at the bound,
            //     an API failure mid-walk, a parentless evidence-only root,
            //     and an empty or truncated files list (GitHub caps it at
            //     300 entries, and a full list is required to prove a commit
            //     is evidence-only) — at worst a spurious notice.
            let staleNote = null;
            if (violation === null) {
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: ".turnstile/evidence.json",
                  ref: context.payload.pull_request.head.sha,
                });
                const doc = JSON.parse(
                  Buffer.from(res.data.content, res.data.encoding).toString("utf8"),
                );
                const ts = [doc?.plan?.at, doc?.tests?.at, doc?.emittedAt]
                  .filter((t) => typeof t === "string" && t && !Number.isNaN(Date.parse(t)))
                  .sort()
                  .at(-1);
                if (ts !== undefined) {
                  const MAX_WALK = 100;
                  const isEvOnly = (c) => {
                    const files = c.data.files ?? [];
                    return (
                      files.length > 0 &&
                      files.length < 300 &&
                      files.every(
                        (f) =>
                          typeof f.filename === "string" &&
                          f.filename.startsWith(".turnstile/"),
                      )
                    );
                  };
                  let commit = await github.rest.repos.getCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: context.payload.pull_request.head.sha,
                  });
                  const headDate =
                    commit.data.commit.committer?.date ?? commit.data.commit.author?.date;
                  // Walk back through evidence-only commits (the normal
                  // emit-and-commit refresh path) to the first commit that
                  // could have changed code. Every fallback keeps
                  // comparedDate at the head date: conservative, at worst a
                  // spurious notice.
                  let comparedDate = headDate;
                  let sha = context.payload.pull_request.head.sha;
                  for (let i = 0; i < MAX_WALK && isEvOnly(commit); i++) {
                    if (!commit.data.parents?.length) break; // whole visible history is evidence-only
                    sha = commit.data.parents[0].sha;
                    try {
                      commit = await github.rest.repos.getCommit({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: sha,
                      });
                      const d =
                        commit.data.commit.committer?.date ?? commit.data.commit.author?.date;
                      if (!isEvOnly(commit)) {
                        comparedDate = d;
                        break;
                      }
                    } catch (walkErr) {
                      core.info(`Walk-back stopped at ${sha}: ${walkErr instanceof Error ? walkErr.message : String(walkErr)}`);
                      break;
                    }
                  }
                  if (
                    typeof comparedDate === "string" &&
                    Date.parse(ts) < Date.parse(comparedDate)
                  ) {
                    staleNote =
                      `> ⚠ Stale: the last journaled event (${ts}) predates the ` +
                      `latest non-evidence commit (${comparedDate}). Re-run the ` +
                      `evidence emitter and commit both .turnstile/ files to ` +
                      `refresh the badge.`;
                  }
                }
              } catch (e) {
                core.info(`Staleness check skipped: ${e instanceof Error ? e.message : String(e)}`);
              }
            }

            // 3. Append the staleness notice on the valid path and upsert
            //    the single comment keyed on the marker: update the
            //    existing one if found, create it only when none is found.
            //    Never a second comment. `github.paginate(endpoint, params)`
            //    returns the flattened list of all pages' items — the
            //    endpoint is passed unexecuted, with the params alongside it
            //    (calling the endpoint here would start the request and pass
            //    a Promise, which paginate cannot iterate).
            if (staleNote !== null) {
              body = body.endsWith("\n") ? body + staleNote : body + "\n" + staleNote;
            }
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => typeof c.body === "string" && c.body.includes(MARKER),
            );
            if (existing !== null && existing !== undefined) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
