# turnstile evidence — two jobs, two trust levels, one file.
#
#   pull_request        Validate. Checks out the PR head and runs
#                       `opencode-turnstile evidence --validate` on
#                       .turnstile/evidence.json. This job runs untrusted
#                       code, so its permissions are `contents: read` only:
#                       no `pull-requests: write` is granted here at all, so a
#                       compromise has nothing to spend.
#   pull_request_target  Publish. Runs the base ref's copy of this file (a pull
#                       request cannot rewrite the posting logic in its own
#                       diff), in the base context with a writable token. It
#                       has no checkout step and no run step: it reads the one
#                       artifact file through the Contents API, asserts two
#                       byte-level invariants, and upserts one comment keyed
#                       on the `turnstile:evidence` marker it searches for.
#
# Contributor bytes may be read; they are never executed. GitHub asks a
# maintainer to approve the first run from a new fork contributor, so a first
# badge can sit pending. To skip the wait where you already have comment
# rights:
#   gh pr comment <n> --repo <owner>/<repo> --body-file .turnstile/evidence.md
#
# Copy this file into your repo's .github/workflows/. The emitter writes both
# .turnstile/evidence.json and the sibling .turnstile/evidence.md
# (`evidence --out .turnstile/evidence.json`); commit both. The posted body is
# the committed Markdown verbatim — neither job reads a journal or runs the
# pipeline.

name: turnstile evidence

on:
  # Job 1 — validate. Runs against the PR head (untrusted code) with a
  # read-only token, so it may run the contributor's artifact and CLI flags but
  # holds no write permission to abuse.
  pull_request:
    types: [opened, synchronize, reopened]
  # Job 2 — publish. Base context, writable token, no checkout and no run
  # step: it reads the one artifact file and asserts byte invariants on it.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents:
    read # workflow floor; `pull-requests: write` is granted per-job
    # on the publish job only, so the validate job holds nothing

jobs:
  validate:
    # on: pull_request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate the committed evidence artifact
        run: |
          if [ ! -f .turnstile/evidence.json ]; then
            echo "No .turnstile/evidence.json committed; nothing to validate."
            exit 0
          fi
          npx --yes opencode-turnstile@0.10.0 evidence --validate .turnstile/evidence.json

  publish:
    # on: pull_request_target; permissions: contents:read +
    # pull-requests:write; runs only when the artifact validated
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert the sticky evidence comment
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- turnstile:evidence -->";
            const MAX_BYTES = 1024;
            const RULE_FIRST_LINE = "the first line is not exactly the turnstile:evidence marker";
            const RULE_SIZE = "the body exceeds 1 KiB";

            // 1. Read the one artifact file from the PR head through the
            //    Contents API. An open PR's head SHA is served by the base
            //    repository, so fork PRs resolve. A missing file is a no-op,
            //    not an error: a repo without the artifact simply has no
            //    badge.
            let body;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".turnstile/evidence.md",
                ref: context.payload.pull_request.head.sha,
              });
              body = Buffer.from(res.data.content, res.data.encoding).toString("utf8");
            } catch (e) {
              if (e.status === 404) {
                core.info("No .turnstile/evidence.md at the PR head; nothing to post.");
                return;
              }
              throw e;
            }

            // 2. Assert the two byte-level invariants. On failure, post a
            //    fixed red notice that names the rule — never the offending
            //    bytes — so a smuggled body can only cost the badge.
            let violation = null;
            if (body.split("\n")[0] !== MARKER) violation = RULE_FIRST_LINE;
            else if (Buffer.byteLength(body, "utf8") > MAX_BYTES) violation = RULE_SIZE;
            if (violation !== null) {
              body = [
                MARKER,
                `> **turnstile ✗** — committed evidence artifact rejected: ${violation}.`,
                ">",
                "> _Not proof: a correlated claim from the local journal. Ask for the journal to audit._",
              ].join("\n");
            }

            // 3. Upsert the single comment keyed on the marker: update the
            //    existing one if found, create it only when none is found.
            //    Never a second comment. `github.paginate(endpoint, params)`
            //    returns the flattened list of all pages' items — the
            //    endpoint is passed unexecuted, with the params alongside it
            //    (calling the endpoint here would start the request and pass
            //    a Promise, which paginate cannot iterate).
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => typeof c.body === "string" && c.body.includes(MARKER),
            );
            if (existing !== null && existing !== undefined) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
